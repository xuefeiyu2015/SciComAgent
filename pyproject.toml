[project]
name = "scicomagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.111.0",
    "arxiv>=4.0.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "langchain>=1.3.10",
    "langchain-anthropic>=1.4.6",
    "langgraph>=1.2.6",
    "mcp>=1.28.0",
    "openai>=2.43.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.27.2.3",
    "pyyaml>=6.0.3",
    "trafilatura>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
