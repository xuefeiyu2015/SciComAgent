# agent.yaml —  MCP agent manifest
# Models are declared by ROLE; concrete names live in config, never here.

name: scicomm-agent
version: 0.1.0
owner: "xuefeiyu"

# Routing: how user requests map to this agent
routing:
  # Two kinds of request, on purpose. The first four are "turn this paper into
  # something"; the rest are follow-ups on a paper this agent has ALREADY
  # drafted — a redraft, another platform, a translation, a question about the
  # background. A host with only the first set never learns the run is
  # re-enterable, and answers "now in English" by saying it cannot.
  intents: [paper to public, science communication, explain research,
            redraft a draft, translate a draft, another platform for a draft,
            ask about a paper]
  keywords: [sci-comm, paper, news, wechat, xiaohongshu, explainer,
             redraft, rewrite, translate, in english, another version]

# MCP tools exposed by /mcp (thin wrappers over /api)
tools:
  - name: generate
    description: Turn a paper into multi-platform sci-comm drafts + provenance + overstatement flags
    parameters:
      source_type: { required: true, allowed: [doi, url, pdf], description: "How to interpret `source`" }
      source:     { required: true,  description: "PDF link / DOI / web URL of the paper" }
      platforms:  { required: false, default: [news, xhs], allowed: [news, wechat, xhs], description: "`wechat` is an ALIAS for `xhs` — they share one style card and are drafted once; the output is labelled `xhs`" }
      language:   { required: false, default: zh, allowed: [zh, en] }
      audience:   { required: false, default: general_public }
      liveliness: { required: false, default: 3, min: 1, max: 5, description: "Tone AND shape. 1 = sober and plain; 4-5 additionally ask for a narrative rather than a list of findings. Never the facts" }
      length:     { required: false, default: 3, min: 1, max: 5, description: "How long the piece runs, RELATIVE to the platform's own style card. 3 = the card's range; 2 = shorter, 1 = much shorter; 4-5 = longer. Length is shape, never the facts — a shorter draft drops findings, never qualifiers" }
      background: { required: false, default: true, description: "Run the researcher: external background materials for story framing, AND a glossary of what the paper's terms and quantities mean. Framing and wording only, never facts" }
      # `off` is quoted: bare off is a YAML 1.1 boolean and would load as `false`.
      images:     { required: false, default: "off", allowed: ["off", cover, all], description: "How much illustration to produce after the drafts are checked. `off` (default) = none; `cover` = one cover image; `all` = the cover plus one explainer per claim. The cover is model-generated decoration, an explainer is a deterministically rendered claim card — images never add facts, and a failure here never blocks the drafts (see the `image_error` notice)" }
      wait_seconds: { required: false, default: 10, min: 0, max: 25, description: "How long to hold the call open for a fast run before returning a session_id instead. Clamped server-side" }
    # Return contract (see AgentOutput in api/schema.py). Never auto-published.
    output:
      platform_outputs:     "Per-platform drafts (title_options, cover_copy, body, hashtags)"
      claim_ledger:         "Source-grounded claims with evidence + qualifier"
      overreach_flags:      "Statements that over-claim vs. the ledger (for a human)"
      background_materials: "External context shown to the drafter (framing only, never facts; audit trail)"
      glossary:             "Plain-language meanings for the paper's jargon, plus scale anchors for its quantities (wording only, never facts; audit trail — an unsourced entry is marked)"
      jargon_flags:         "Terms a reader cannot parse that are still in a draft. Readability, not faithfulness — distinct from overreach_flags"
      images:               "Image assets for this run, when `images` asked for them (absent or empty otherwise). Each is {kind: cover|explainer, claim_id, path, alt, generated}. A COVER is model-generated decoration — `generated: true`, with the prompt and model role that made it. An EXPLAINER is a deterministically rendered claim card: its content came from a `Claim` in the ledger, not from a model, so `generated: false` and there is no prompt. `generated: false` is therefore the marker that an image states nothing the ledger does not"
      style_profile:        "Learned voice distilled from api/styles/examples/ and applied to the drafts (voice & structure only, never facts; audit trail). Absent when the folder is empty"
      session_id:           "Async job handle; present when status=running, and echoed on the partial and final results"
      status:               { allowed: [ok, needs_review, failed, running], description: "Coarse outcome; running = still drafting, poll job_status" }
      # Non-draft messages (e.g. why fetch failed). On failure: status=failed + one notice.
      notices:
        item: { code: NoticeCode, message: "actionable, human-readable reason", source_url: "source the notice is about" }
        code_meanings:
          ok:               "full text obtained"
          need_pdf:         "source exists but access is blocked (paywall) -> ask the user for the PDF"
          too_short:        "reachable but too little text (stub / scanned PDF) -> ask the user for the PDF"
          not_a_paper:      "content is not a research paper -> ask the user to double-check the link"
          rate_limited:     "the publisher is throttling us (HTTP 429/503); the link is fine -> wait a few minutes, or supply the PDF"
          can_restate:      "the source is out of reach, but this run's ledger still holds the paper's own evidence -> a redraft can restate it in the new language; ASK the human first"
          restated:         "this ledger was restated from stored evidence rather than re-read from the paper; the evidence is untouched, the wording is not"
          fetch_error:      "network failure / unreachable link"
          draft_error:      "one platform's draft failed (the other platforms are unaffected)"
          background_error: "background search skipped (drafts unaffected, produced without background)"
          style_error:      "learned writing style skipped (drafts unaffected, produced in the default voice)"
          image_error:      "one or more image assets were skipped (drafts unaffected; the run is complete, just without those images). The message says which image and why — an unconfigured image model, a missing font, a refused generation"
          running:          "the run was accepted and is still going -> poll job_status with the session_id"
          done:             "the run FINISHED and this is the whole result -> say so to the human and show it to them. A complete result looks no different from a partial one to whoever is waiting, and silence reads as still-working"
          unknown_session:  "no job for that session_id (expired, or from another instance / before a restart) -> call generate again"

  - name: redraft
    description: Write an EARLIER RUN's paper again with different settings — another language, another platform, a different tone or reader. Use this instead of calling generate twice on the same paper. Never publishes
    parameters:
      session_id: { required: true, description: "The earlier run to redraft, from `generate`. A redraft can itself be redrafted — use the id it returns" }
      platforms:  { required: false, allowed: [news, wechat, xhs], description: "Omit to keep the run's platforms. `wechat` is an ALIAS for `xhs`" }
      language:   { required: false, allowed: [zh, en], description: "Omit to keep the run's language. CHANGING IT rebuilds the claim ledger, because the ledger is written in the run's language; every other setting reuses it and is much faster" }
      audience:   { required: false, description: "Omit to keep the run's reader" }
      liveliness: { required: false, min: 1, max: 5, description: "Omit to keep the run's tone" }
      length:     { required: false, min: 1, max: 5, description: "Omit to keep the run's length. THIS is the setting for \"make it shorter\" (2) or \"much shorter\" (1) — not liveliness" }
      background: { required: false, description: "Omit to keep the run's setting. Turning it ON researches now, from the stored paper — no re-fetch" }
      # `off` is quoted: bare off is a YAML 1.1 boolean and would load as `false`.
      images:     { required: false, allowed: ["off", cover, all], description: "How much illustration the REDRAFT produces. Omit to keep the run's setting, like the other dials — but the setting is what carries over, never the IMAGES: a redraft always generates its own under its new session_id, so omitting this on a run drafted with images=off leaves the redraft without any. Changing only this still takes the fast ledger-reuse path. To illustrate the ORIGINAL run instead of writing it again, use `illustrate`" }
      from_ledger: { required: false, default: false, description: "Only after a redraft returned a `can_restate` notice. true = restate the ledger in the new language from the evidence the first run stored, instead of re-reading a paper that is out of reach. ASK THE HUMAN FIRST — provenance is carried over, not read fresh; the result is marked `restated`" }
      wait_seconds: { required: false, default: 10, min: 0, max: 25, description: "As in `generate`: how long to hold the call open before returning the NEW session_id instead" }
    # Same AgentOutput contract as `generate`, under a NEW session_id. The
    # original run is untouched, and the drafts are checked exactly as a first
    # run's are. Which paper it is can never be changed — that is `generate`.
    output:
      platform_outputs: "Per-platform drafts, written again under the new settings"
      claim_ledger:     "The same provenance, reused — or rebuilt in the new language"
      overreach_flags:  "Re-checked by the reviewer, exactly as on a first run"
      session_id:       "The REDRAFT's own handle — poll this one, not the id you passed in"
      status:           { allowed: [needs_review, failed, running], description: "running = still drafting, poll job_status" }
      notices:          "unknown_session = that run expired or came from another instance -> call generate with the source again"

  - name: extract_ledger
    description: Extract just the claim ledger (source-grounded facts) from a paper, without drafting — a cheap provenance preview
    parameters:
      source_type: { required: true, allowed: [doi, url, pdf], description: "How to interpret `source`" }
      source:     { required: true,  description: "PDF link / DOI / web URL of the paper" }
      language:   { required: false, default: zh, allowed: [zh, en] }
    # Returns an AgentOutput with claim_ledger populated + platform_outputs empty.
    output:
      claim_ledger: "Source-grounded claims with evidence + qualifier"
      notices:      "Non-draft messages (e.g. need_pdf / too_short guidance)"
      status:       { allowed: [ok, no_claims, failed], description: "ok = ledger ready; no_claims = nothing sourced; failed = fetch error" }

  - name: check_draft
    description: Re-check a (possibly human-edited) draft against its claim ledger; returns overstatement flags. Never publishes
    parameters:
      draft:    { required: true, description: "Draft to audit (PlatformOutput: platform, title_options, cover_copy, body, hashtags)" }
      ledger:   { required: true, description: "Claim ledger the draft must stay within (e.g. from extract_ledger)" }
      language: { required: false, default: zh, allowed: [zh, en] }
    # Uses the reviewer role (DIFFERENT model than the drafter). Empty list = clean.
    output:
      flags: "List of overstatement flags {claim_id, quote, issue, suggestion}; empty means faithful"

  - name: render
    description: Format a generate/extract_ledger result as human-readable Markdown (display only; never publishes)
    parameters:
      result:             { required: true, description: "The AgentOutput to render (from generate / extract_ledger)" }
      platform:           { required: false, allowed: [news, wechat, xhs], description: "Render only this platform's draft; omit for all" }
      include_provenance: { required: false, default: true, description: "true = review view (flags + draft + ledger + sources); false = publish-ready post only" }
    output:
      markdown: "A Markdown string for display"

  - name: job_status
    description: Check a background generate run — stage, steps done, platforms ready. Cheap; safe to poll
    parameters:
      session_id: { required: true, description: "The id returned by `generate`" }
    output:
      state:            { allowed: [queued, running, done, failed, lost], description: "lost = expired / another instance; call generate again" }
      kind:             { allowed: [run, redraft], description: "What finished: a first pass over a paper, or a rewrite of an earlier one. 'Finished' answers a different question for each" }
      stage:            "fetch | ledger | background | style | draft:<platform> | done"
      steps_done:       "Milestones completed"
      steps_total:      "Milestones expected (4 + one per platform)"
      platforms_ready:  "Platforms whose draft job_result can already return"
      elapsed_s:        "Seconds since the run started"
      message:          "The status line in words. On state=done it says the draft (or the redraft) is finished — pass that on the moment you see it; the human is watching and cannot tell a finished run from a slow one"
      result_available: "Whether job_result has anything to return yet"

  - name: job_result
    description: Fetch a background run's output; partial (status=running) while it is still drafting
    parameters:
      session_id: { required: true, description: "The id returned by `generate`" }
    # Same AgentOutput contract as `generate`. A partial never carries a finished status.
    output:
      status: { allowed: [needs_review, running, failed], description: "running = partial result, keep polling" }
      notices: "A finished result carries a `done` notice saying what it produced -> announce it; do not hand back a finished draft in silence"

  - name: illustrate
    description: Generate image assets (cover and/or per-claim explainers) for an EARLIER RUN that already finished, without redrafting it. Use this for a run made before images existed, or one drafted with images=off. Never publishes
    parameters:
      session_id: { required: true, description: "The run to illustrate, from `generate` or `redraft`. Must already be finished — a still-running job is refused" }
      images:     { required: true, allowed: ["off", cover, all], description: "How much to generate: `cover` for just the cover image, `all` for the cover plus one explainer image per claim. `off` is accepted but generates nothing" }
      force:      { required: false, default: false, description: "Regenerate images even if this session already has some. false (default) leaves existing images alone" }
    # The SAME AgentOutput contract as `generate`, under the SAME session_id:
    # the run's stored result is rewritten in place, so a later job_result /
    # render on that id shows the new images too. Drafts, ledger and flags are
    # returned untouched — this tool never rewrites a word of the piece.
    output:
      images:           "The assets just produced, in the shape `generate` returns them: a model-generated cover (`generated: true`) and, for images=all, one deterministically rendered claim card per claim (`generated: false` — its content came from a `Claim`, not a model)"
      platform_outputs: "The run's existing drafts, unchanged — illustrating never redrafts"
      claim_ledger:     "The run's existing provenance, unchanged"
      session_id:       "The id you passed in; there is no new run to poll"
      status:           { allowed: [ok, needs_review, failed], description: "failed = unknown/expired session, or the job is still running (the notice says which); the run's stored result is left alone in that case" }
      notices:          "image_error = an asset was skipped and why (an unconfigured image model, a missing font); the drafts and the rest of the result are unaffected"

  - name: ping
    description: Dummy connectivity check — returns one sentence; no models, no network, no pipeline
    parameters:
      name: { required: false, default: world, description: "Who to greet in the returned sentence" }
    output:
      message: "A single greeting sentence confirming the server is reachable"

  - name: health
    description: Report agent readiness — configured model roles, enabled search sources, optional-key presence, and whether claim cards can be drawn (booleans only, never values)
    parameters: {}
    output:
      roles:          "Per-role resolvability {extractor, drafter, reviewer, researcher, stylist, image_reviewer: bool}"
      search_sources: "Enabled external search clients"
      optional_keys:  "Presence of optional API keys {tavily, semantic_scholar, ncbi: bool}"
      byo_key:        "Always true — keys are brought via env, never stored"
      card_font:      "A font claim cards can be drawn with exists; false means every card will refuse (#44)"

# Models are declared by ROLE; concrete names live in config, never here.
model_requirements:
  - { role: extractor,  tier: cheap }    # fetch/extract + claim ledger
  - { role: drafter,    tier: writing }  # per-platform draft
  - { role: reviewer,   tier: strong }   # faithfulness check (different model than drafter)
  - { role: researcher, tier: cheap }    # topic abstraction + background search (falls back to extractor)
  - { role: stylist,    tier: cheap }    # distill example articles into a voice profile (falls back to extractor)
  - { role: image_reviewer, tier: cheap } # checks a generated cover for lettering (falls back to extractor); needs image input

# Schema describing the agent's configurable settings (see config/).
config_schema:
  models:
    extractor:  { provider: env, model: env }
    drafter:    { provider: env, model: env }
    reviewer:   { provider: env, model: env }
    researcher: { provider: env, model: env }  # optional; unconfigured -> extractor
    stylist:    { provider: env, model: env }  # optional; unconfigured -> extractor
  byo_key: true
  # Learned writing style distilled from api/styles/examples/ (voice only, never
  # facts). auto = on whenever that folder is non-empty; false = default voice.
  style:
    enabled: auto
  # `wechat` is an alias for `xhs` (one shared style card, drafted once).
  platforms: [news, xhs]
  # Background-materials search: which external sources to query (all keyless).
  # tavily may be added when TAVILY_API_KEY is provided via env (byo_key).
  search:
    sources: [arxiv, semantic_scholar, pubmed, crossref, wikipedia, ddgs]
  # Image assets. HOW MUCH to generate is the per-call `images` dial on
  # generate / redraft / illustrate, not a config key — these three only say
  # which model draws a cover, how many explainers a run may render, and which
  # font the claim cards use. GOOGLE_API_KEY is env-only (byo_key), never here.
  images:
    model:     env  # -> IMAGE_MODEL      (required for cover generation)
    cap:       env  # -> IMAGE_CAP        (max images per run; default 3)
    font_path: env  # -> IMAGE_FONT_PATH  (claim-card font; falls back to system fonts)

# Health/readiness probe
health: /health
