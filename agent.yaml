# agent.yaml — Turing Planet MCP agent manifest
# Models are declared by ROLE; concrete names live in config, never here.

name: scicomm-agent
version: 0.1.0
owner: "xuefeiyu"

# Routing: how user requests map to this agent
routing:
  intents: [paper to public, science communication, explain research]
  keywords: [sci-comm, paper, news, wechat, xiaohongshu, explainer]

# MCP tools exposed by /mcp (thin wrappers over /api)
tools:
  - name: generate
    description: Turn a paper into multi-platform sci-comm drafts + provenance + overstatement flags
    parameters:
      source:     { required: true,  description: "PDF link / DOI / web URL of the paper" }
      platforms:  { required: false, default: [news, wechat, xhs], allowed: [news, wechat, xhs] }
      language:   { required: false, default: zh, allowed: [zh, en] }
      audience:   { required: false, default: general_public }
      liveliness: { required: false, default: 3, min: 1, max: 5 }

# Models are declared by ROLE; concrete names live in config, never here.
model_requirements:
  - { role: extractor, tier: cheap }    # fetch/extract + claim ledger
  - { role: drafter,   tier: writing }  # per-platform draft
  - { role: reviewer,  tier: strong }   # faithfulness check (different model than drafter)

# Schema describing the agent's configurable settings (see config/).
config_schema:
  models:
    extractor: { provider: env, model: env }
    drafter:   { provider: env, model: env }
    reviewer:  { provider: env, model: env }
  byo_key: true
  platforms: [news, wechat, xhs]

# Health/readiness probe
health: /health
