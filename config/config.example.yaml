# config.example.yaml — copy to config/config.yaml and fill in.
# NEVER commit real tokens/keys. config/*.yaml is gitignored (this example is not).
#
# Models are referenced by ROLE; concrete names live here (or in env), never in code:
#   extractor  cheap   — fetch/extract + claim ledger
#   drafter    low-cost — per-platform draft
#   reviewer   strong  — faithfulness check (MUST differ from drafter)
#   researcher cheap   — topic abstraction + background search (OPTIONAL: falls back to extractor)
#   stylist    cheap   — distill example articles into a voice profile (OPTIONAL: falls back to extractor)
#
# Each provider/model value may be:
#   - a literal string            -> "anthropic", "claude-haiku-4-5-20251001"
#   - the placeholder "env"       -> read the default env var for that role/field
#                                    (e.g. EXTRACTOR_PROVIDER, EXTRACTOR_MODEL)
#   - "env:SOME_VAR"              -> read that specific env var
# Placeholders below resolve from the environment so this example ships no names.

byo_key: true   # API keys are brought by the operator via environment, never stored here.

models:
  extractor:
    provider: env   # -> EXTRACTOR_PROVIDER   (e.g. anthropic / openai / google)
    model: env      # -> EXTRACTOR_MODEL      (cheap model)
  drafter:
    provider: env   # -> DRAFTER_PROVIDER
    model: env      # -> DRAFTER_MODEL        (low-cost writing model)
  reviewer:
    provider: env   # -> REVIEWER_PROVIDER
    model: env      # -> REVIEWER_MODEL       (strong model, MUST differ from drafter)
  researcher:
    provider: env   # -> RESEARCHER_PROVIDER  (optional; unconfigured -> extractor)
    model: env      # -> RESEARCHER_MODEL
  stylist:
    provider: env   # -> STYLIST_PROVIDER     (optional; unconfigured -> extractor)
    model: env      # -> STYLIST_MODEL

# Learned writing style: drop popular-science articles you like into
# api/styles/examples/ and they are distilled into a voice profile for the
# drafter (voice only, never facts; layers on top of api/styles/*.md).
# `enabled` uses the same "env" indirection (env var: STYLE_ENABLED).
#   auto (default) — on whenever the examples folder is non-empty
#   false          — off; drafts keep the default voice
style:
  enabled: auto

# Background-materials search (framing context for the drafter, never facts).
# `sources` picks which external clients to query; same "env" indirection as
# models (env var: SEARCH_SOURCES, comma-separated). All defaults are KEYLESS.
# Optional env keys, never stored here (byo_key):
#   TAVILY_API_KEY  — add "tavily" to sources for paid web search
#   S2_API_KEY      — Semantic Scholar rate-limit boost (works without)
#   NCBI_API_KEY    — PubMed rate-limit boost (works without)
search:
  sources: [arxiv, semantic_scholar, pubmed, crossref, wikipedia, ddgs]

# Pipeline concurrency. Platform drafts are independent, so they run in
# parallel; each one is its own drafter + reviewer chain. Lower this (1 =
# serial) if your provider rate-limits the burst. Env var: DRAFT_WORKERS.
pipeline:
  draft_workers: 3

# Image assets for a run: a cover (model-generated decoration) and, per claim,
# an explainer card (deterministically rendered from the claim ledger — never
# model-generated, so it can state nothing the ledger does not).
# HOW MUCH to generate is NOT configured here: it is the per-call `images` dial
# on generate / redraft / illustrate (off / cover / all, default off).
# Same "env" indirection as models/style/search; env vars named below.
# Optional env key, never stored here (byo_key):
#   GOOGLE_API_KEY  — required for cover generation; env only, never in config
images:
  model: env      # -> IMAGE_MODEL      (image model, e.g. gemini-2.5-flash-image — what a standard Gemini API key serves; an imagen-* model works on a key that has one; unset -> cover generation is skipped with an image_error notice)
  cap: env        # -> IMAGE_CAP        (max explainer cards per run; default 3, non-numeric falls back to 3, negative means none)
  font_path: env  # -> IMAGE_FONT_PATH  (font the claim cards are drawn with; a missing path falls back to system fonts, and if none load the card is refused rather than drawn as tofu)
