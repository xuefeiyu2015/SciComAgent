# config.example.yaml — copy to config/config.yaml and fill in.
# NEVER commit real tokens/keys. config/*.yaml is gitignored (this example is not).
#
# Models are referenced by ROLE; concrete names live here (or in env), never in code:
#   extractor  cheap   — fetch/extract + claim ledger
#   drafter    low-cost — per-platform draft
#   reviewer   strong  — faithfulness check (MUST differ from drafter)
#   researcher cheap   — topic abstraction + background search (OPTIONAL: falls back to extractor)
#
# Each provider/model value may be:
#   - a literal string            -> "anthropic", "claude-haiku-4-5-20251001"
#   - the placeholder "env"       -> read the default env var for that role/field
#                                    (e.g. EXTRACTOR_PROVIDER, EXTRACTOR_MODEL)
#   - "env:SOME_VAR"              -> read that specific env var
# Placeholders below resolve from the environment so this example ships no names.

byo_key: true   # API keys are brought by the operator via environment, never stored here.

models:
  extractor:
    provider: env   # -> EXTRACTOR_PROVIDER   (e.g. anthropic / openai / google)
    model: env      # -> EXTRACTOR_MODEL      (cheap model)
  drafter:
    provider: env   # -> DRAFTER_PROVIDER
    model: env      # -> DRAFTER_MODEL        (low-cost writing model)
  reviewer:
    provider: env   # -> REVIEWER_PROVIDER
    model: env      # -> REVIEWER_MODEL       (strong model, MUST differ from drafter)
  researcher:
    provider: env   # -> RESEARCHER_PROVIDER  (optional; unconfigured -> extractor)
    model: env      # -> RESEARCHER_MODEL

# Background-materials search (framing context for the drafter, never facts).
# `sources` picks which external clients to query; same "env" indirection as
# models (env var: SEARCH_SOURCES, comma-separated). All defaults are KEYLESS.
# Optional env keys, never stored here (byo_key):
#   TAVILY_API_KEY  — add "tavily" to sources for paid web search
#   S2_API_KEY      — Semantic Scholar rate-limit boost (works without)
#   NCBI_API_KEY    — PubMed rate-limit boost (works without)
search:
  sources: [arxiv, semantic_scholar, pubmed, crossref, wikipedia, ddgs]
