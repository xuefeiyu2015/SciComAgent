<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScicomAgent</title>
<meta data-i18n-doctitle="app.title.front">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/board.css">
<link rel="stylesheet" href="/static/front.css">
</head>
<body class="front">

<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-name" data-i18n="app.name">白话智能体</span>
    <span class="brand-sub" data-i18n="app.sub">ScicomAgent</span>
  </a>
  <nav>
    <a class="nav-link" href="#tools" data-i18n="nav.tools">MCP 工具</a>
    <a class="nav-link" href="#pipeline" data-i18n="nav.pipeline">工作流程</a>
    <button class="btn btn-lang" type="button" data-lang-switch data-i18n-title="lang.label">English</button>
    <a class="btn btn-inverse" href="/board" data-i18n="nav.board">打开审稿台</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-copy">
    <h1 data-i18n="front.hero.title">把一篇论文，写成公众读得懂的稿子。</h1>
    <p data-i18n="front.hero.lead"></p>
    <p class="en" data-i18n="front.hero.note"></p>
  </div>

  <figure class="demo">
    <figcaption data-i18n="front.demo.caption"></figcaption>
    <div class="demo-ledger">
      <span class="demo-id">c1</span>
      <span data-i18n="front.demo.claim"></span>
      <span class="demo-meta" data-i18n="front.demo.meta"></span>
    </div>
    <div class="demo-row demo-ok">
      <span class="demo-verdict" data-i18n="front.demo.written"></span>
      <p><span data-i18n="front.demo.writtenText"></span><sup class="demo-cite">c1</sup><span data-i18n="front.demo.stop"></span></p>
    </div>
    <div class="demo-row demo-no">
      <span class="demo-verdict" data-i18n="front.demo.refused"></span>
      <p><span class="demo-flag" data-i18n="front.demo.refusedText"></span><sup class="demo-query">?</sup></p>
      <small data-i18n="front.demo.why"></small>
    </div>
  </figure>
</section>

<section class="band">
  <h2 class="section-head" data-i18n="front.rules.head"></h2>
  <div class="rules">
    <article><h3 data-i18n="front.rules.1.title"></h3><p data-i18n="front.rules.1.body"></p></article>
    <article><h3 data-i18n="front.rules.2.title"></h3><p data-i18n="front.rules.2.body"></p></article>
    <article><h3 data-i18n="front.rules.3.title"></h3><p data-i18n="front.rules.3.body"></p></article>
    <article><h3 data-i18n="front.rules.4.title"></h3><p data-i18n="front.rules.4.body"></p></article>
  </div>
</section>

<section class="band" id="pipeline">
  <h2 class="section-head" data-i18n="front.pipeline.head"></h2>
  <ol class="pipeline">
    <li><span class="step">01</span><h3 data-i18n="front.pipeline.1.title"></h3><p data-i18n="front.pipeline.1.body"></p></li>
    <li><span class="step">02</span><h3 data-i18n="front.pipeline.2.title"></h3><p data-i18n="front.pipeline.2.body"></p></li>
    <li><span class="step">03</span><h3 data-i18n="front.pipeline.3.title"></h3><p data-i18n="front.pipeline.3.body"></p></li>
    <li><span class="step">04</span><h3 data-i18n="front.pipeline.4.title"></h3><p data-i18n="front.pipeline.4.body"></p></li>
  </ol>
  <p class="aside" data-i18n-html="front.pipeline.aside"></p>
</section>

<section class="band" id="tools">
  <h2 class="section-head" data-i18n="front.tools.head"></h2>
  <p class="aside" data-i18n-html="front.tools.aside"></p>
  <div id="tools-list" class="tools"></div>
</section>

<section class="band">
  <h2 class="section-head" data-i18n="front.roles.head"></h2>
  <p class="aside" data-i18n="front.roles.aside"></p>
  <div id="roles-list" class="roles"></div>
</section>

<footer class="foot">
  <a class="btn btn-solid" href="/board" data-i18n="front.foot.cta"></a>
  <p data-i18n="front.foot.note"></p>
</footer>

<script src="/static/i18n.js"></script>
<script src="/static/front.js"></script>
</body>
</html>
